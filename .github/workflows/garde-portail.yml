name: Garde du portail
on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: garde-portail
  cancel-in-progress: false
jobs:
  garde:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Remettre index.html en état
        run: python3 .github/garde.py
      - name: Publier la correction
        run: |
          git diff --quiet -- index.html && exit 0
          git config user.name "garde-portail"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: garde du portail (Tally, extensions.js)" -- index.html
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 5)); done
          exit 1
